<svg width="200" height="40" viewBox="0 0 200 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Logo Icon -->
  <g id="logo-icon">
    <!-- Dark purple square background -->
    <rect x="0" y="8" width="24" height="24" rx="4" fill="#4C1D95"/>
    
    <!-- Four vertical bars of increasing height -->
    <rect x="6" y="14" width="3" height="6" fill="#A78BFA"/>
    <rect x="10" y="12" width="3" height="8" fill="#C084FC"/>
    <rect x="14" y="10" width="3" height="10" fill="#E879F9"/>
    
    <!-- Three small light purple circles above bars -->
    <circle cx="7.5" cy="12" r="1.5" fill="#DDD6FE"/>
    <circle cx="12" cy="10" r="2" fill="#DDD6FE"/>
    <circle cx="16.5" cy="8" r="2.5" fill="#DDD6FE"/>
  </g>
  
  <!-- Company Name -->
  <g id="company-text">
    <!-- "think" in darker purple -->
    <text x="32" y="20" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#4C1D95">
      think
    </text>
    
    <!-- "highly apps" in brighter purple -->
    <text x="68" y="20" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#7C3AED">
      highly apps
    </text>
    
    <!-- Underline -->
    <line x1="32" y1="24" x2="158" y2="24" stroke="#A78BFA" stroke-width="1"/>
    
    <!-- Tagline "BUILD SMARTER" -->
    <text x="32" y="32" font-family="Inter, sans-serif" font-size="7" font-weight="500" fill="#A78BFA" letter-spacing="1">
      BUILD SMARTER
    </text>
  </g>
</svg>
